<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Fleet</title>
<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --ink: #1c2329;
    --muted: #5f6b76;
    --line: #e1e6eb;
    --accent: #0a7fc2;
    --good: #1e8a4c;
    --good-bg: #e3f4ea;
    --warn: #a15c00;
    --warn-bg: #fdf0dc;
    --bad: #b3261e;
    --off: #9aa5af;
    --chip: #eef2f5;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111416;
      --surface: #1b2024;
      --ink: #e6ebef;
      --muted: #9aa6b0;
      --line: #2a3137;
      --accent: #4fb3ea;
      --good: #5fd08e;
      --good-bg: #183324;
      --warn: #f0b35a;
      --warn-bg: #3a2c14;
      --bad: #f28b82;
      --off: #5c666e;
      --chip: #252c31;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111416; --surface: #1b2024; --ink: #e6ebef; --muted: #9aa6b0;
    --line: #2a3137; --accent: #4fb3ea; --good: #5fd08e; --good-bg: #183324;
    --warn: #f0b35a; --warn-bg: #3a2c14; --bad: #f28b82; --off: #5c666e; --chip: #252c31;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 500; margin: 0; letter-spacing: -0.01em; }
  .summary { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .summary b { color: var(--ink); font-weight: 500; }
  .summary .warn b { color: var(--warn); }
  .spacer { flex: 1; }
  button {
    font: inherit; color: var(--accent); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { background: var(--chip); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { color: var(--muted); font-size: 13px; margin: -6px 0 14px; }
  .note.err { color: var(--bad); }

  .table { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 1040px; }
  th {
    text-align: left; font-weight: 500; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.04em;
    padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tr.offline td { color: var(--muted); }
  .name { font-weight: 500; color: var(--ink); }
  .sub { color: var(--muted); font-size: 12.5px; }
  .mono { font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .status { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
  .online .dot { background: var(--good); box-shadow: 0 0 0 3px var(--good-bg); }
  .chip {
    display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px;
    background: var(--chip); color: var(--muted); white-space: nowrap; vertical-align: 1px;
  }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.current { background: var(--good-bg); color: var(--good); }
  .badge.outdated { background: var(--warn-bg); color: var(--warn); }
  .badge.ahead, .badge.unknown { background: var(--chip); color: var(--muted); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .page { max-width: 260px; overflow-wrap: anywhere; }
  .actions { white-space: nowrap; text-align: right; }
  .open {
    display: inline-flex; vertical-align: -3px; margin-left: 6px;
    color: var(--muted); border-radius: 4px;
  }
  .open:hover { color: var(--accent); text-decoration: none; }
  .open svg { width: 17px; height: 17px; fill: currentColor; }
  .actions button { padding: 3px 9px; font-size: 12.5px; color: var(--muted); }
  .empty { padding: 36px 16px; text-align: center; color: var(--muted); }
  .facts { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .facts .lag { color: var(--warn); }
  tr.detail > td { padding: 0 14px 16px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px 22px; background: var(--chip); border-radius: 8px; padding: 14px 16px;
  }
  .grid dt {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); margin-bottom: 2px;
  }
  .grid dd { margin: 0; font-size: 13px; overflow-wrap: anywhere; }
  .grid dd .sub { display: block; }
  .more { color: var(--muted); }
  .more[aria-expanded="true"] svg { transform: rotate(180deg); }
  .more svg { width: 16px; height: 16px; fill: currentColor; vertical-align: -3px; transition: transform 0.15s; }
  @media (prefers-reduced-motion: reduce) { .more svg { transition: none; } }
  @media (prefers-reduced-motion: no-preference) { .dot { transition: background 0.3s; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Panel Fleet</h1>
    <div class="summary" id="summary"></div>
    <div class="spacer"></div>
    <button id="scan" type="button">Scan now</button>
  </header>
  <p class="note" id="note"></p>
  <div class="table">
    <table>
      <thead>
        <tr>
          <th>Status</th>
          <th>Panel</th>
          <th>Display</th>
          <th>Network</th>
          <th>Version</th>
          <th>Showing</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="7" class="empty">Looking for panels…</td></tr></tbody>
    </table>
  </div>
</main>
<script>
const KIND = { ks: 'Kiosk Satellite', paneld: 'ha-paneld' };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function ago(ts, now) {
  if (!ts) return 'never seen';
  const s = Math.max(0, now - ts);
  if (s < 60) return 'last seen just now';
  if (s < 3600) return `last seen ${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `last seen ${Math.floor(s / 3600)}h ago`;
  return `last seen ${Math.floor(s / 86400)}d ago`;
}
function duration(s) {
  if (s == null) return '';
  if (s < 3600) return Math.round(s / 60) + ' min';
  if (s < 172800) return Math.round(s / 3600) + ' h';
  return Math.round(s / 86400) + ' days';
}
// The WebView the fleet's best-updated panel runs, so a panel left behind
// can be told from one that is simply on the version everybody is on.
let fleetWebview = null;
function major(v) { const n = parseInt(String(v || ''), 10); return Number.isFinite(n) ? n : null; }
function webviewText(d) {
  if (!d.webview) return '';
  const mine = major(d.webview), best = major(fleetWebview);
  const behind = mine != null && best != null && mine < best;
  return `<span class="${behind ? 'lag' : ''}" title="${esc(d.webview_package || '')} ${esc(d.webview)}${
    behind ? ` \u2014 the fleet is on ${esc(fleetWebview)}` : ''}">WebView ${esc(String(mine ?? d.webview))}${behind ? ' \u2193' : ''}</span>`;
}
// A channel's centre frequency as the band and channel people name it by.
// 2484 is channel 14 and 5935 is 6 GHz channel 2; both sit outside their
// band's arithmetic, which is why they are spelled out.
function channel(mhz) {
  if (!mhz) return null;
  if (mhz === 2484) return { band: '2.4 GHz', ch: 14 };
  if (mhz >= 2412 && mhz <= 2472) return { band: '2.4 GHz', ch: (mhz - 2407) / 5 };
  if (mhz >= 5160 && mhz <= 5885) return { band: '5 GHz', ch: (mhz - 5000) / 5 };
  if (mhz === 5935) return { band: '6 GHz', ch: 2 };
  if (mhz >= 5955 && mhz <= 7115) return { band: '6 GHz', ch: (mhz - 5950) / 5 };
  return null;
}
function displayCell(d) {
  const s = d.screen;
  if (!s) return '<span class="sub">unknown</span>';
  const under = [s.orientation, s.dpi ? `${s.dpi} dpi` : '', s.rotation ? `turned ${s.rotation}\u00b0` : '']
    .filter(Boolean).join(' \u00b7 ');
  return `<div class="mono">${s.width}\u00d7${s.height}</div>` +
    (under ? `<div class="sub">${esc(under)}</div>` : '');
}
function networkCell(d) {
  const l = d.link || {};
  const c = channel(l.frequencyMhz);
  const name = { ethernet: 'Ethernet', wifi: 'Wi-Fi', cellular: 'Cellular', vpn: 'VPN' }[l.type] || '';
  const radio = l.type === 'wifi'
    ? [l.rssi != null ? `${l.rssi} dBm` : '', l.speedMbps ? `${l.speedMbps} Mbps` : ''].filter(Boolean).join(' \u00b7 ')
    : '';
  // Band on the first line with the medium, channel down with the numbers:
  // "Wi-Fi 2.4 GHz" wrapped mid-phrase when the channel rode along with it.
  const under = [c ? `ch ${c.ch}` : '', radio].filter(Boolean).join(' \u00b7 ');
  return (name ? `<div>${esc(name)}${c ? ` ${esc(c.band)}` : ''}</div>` : '') +
    (under ? `<div class="sub">${esc(under)}</div>` : '') +
    `<div class="sub mono">${esc(d.host || '')}${d.hostname ? ` \u00b7 ${esc(d.hostname)}.local` : ''}</div>`;
}
function detailRow(d) {
  const rows = [
    ['Android', [d.android, d.android_api ? `API ${d.android_api}` : ''].filter(Boolean).join(' \u00b7 '),
      d.android_build],
    ['System WebView', d.webview ? `${d.webview}` : '', d.webview_package],
    ['Memory', d.ram_text || ''],
    ['Storage', d.storage_text || ''],
    ['CPU', d.cpu_text || ''],
    ['Uptime', d.uptime_device != null ? `device up ${duration(d.uptime_device)}` : '',
      d.uptime != null ? `app up ${duration(d.uptime)}` : ''],
    ['Battery', d.battery != null ? `${d.battery}%${d.charging ? ' \u00b7 charging' : ''}` : ''],
  ].filter(([, value]) => value);
  return `<tr class="detail" data-detail="${esc(d.key)}"><td colspan="7"><dl class="grid">` +
    rows.map(([label, value, sub]) =>
      `<div><dt>${esc(label)}</dt><dd>${esc(value)}${sub ? `<span class="sub mono">${esc(sub)}</span>` : ''}</dd></div>`).join('') +
    '</dl></td></tr>';
}
function versionCell(d) {
  if (!d.version) return '<span class="sub">unknown</span>';
  const base = d.fork ? d.version.slice(0, d.version.length - d.fork.length) : d.version;
  const label = {
    current: 'Current',
    outdated: 'Update to ' + esc(d.latest),
    ahead: 'Newer than release',
    unknown: 'Latest unknown',
  }[d.version_status];
  return `<div class="mono">${esc(base)}</div>` +
    (d.fork ? `<div class="sub mono" title="Fork build">${esc(d.fork.replace(/^-/, ''))}</div>` : '') +
    `<div style="margin-top:4px"><span class="badge ${d.version_status}">${label}</span></div>`;
}
function pageCell(d) {
  if (!d.dashboard_href) return '<span class="sub">not reported</span>';
  // A bare path is a Home Assistant page: open it on Home Assistant's own origin.
  const href = d.dashboard_href.startsWith('/') ? new URL(d.dashboard_href, location.origin).href : d.dashboard_href;
  const home = d.kind === 'paneld' && d.home_dashboard && d.home_dashboard !== d.dashboard_path
    ? `<div class="sub">home <span class="mono">${esc(d.home_dashboard)}</span></div>` : '';
  return `<a class="page mono" href="${esc(href)}" target="_blank" rel="noopener">${esc(d.dashboard_path)}</a>${home}`;
}
function statusCell(d, now) {
  if (d.online == null) return '<div class="status"><span class="dot"></span>Checking…</div>';
  if (!d.online) {
    return `<div class="status"><span class="dot"></span>Offline</div><div class="sub">${ago(d.last_seen || d.announced, now)}</div>`;
  }
  return '<div class="status online"><span class="dot"></span>Online</div>' +
    (d.uptime != null ? `<div class="sub">up ${duration(d.uptime)}</div>` : '') +
    (d.screen_on === false ? '<div class="sub">screen off</div>' : '');
}
function row(d, now) {
  const on = d.online !== false;
  const status = statusCell(d, now);
  const model = [d.model, d.android].filter(Boolean).join(' · ');
  const facts = webviewText(d);
  return `<tr class="${on ? '' : 'offline'}">
    <td>${status}</td>
    <td><div class="name">${esc(d.name || d.id)}${d.admin
          ? `<a class="open" href="${esc(d.admin)}" target="_blank" rel="noopener" title="Open the admin page" aria-label="Open the admin page for ${esc(d.name || d.id)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3m-2 16H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7Z"/></svg></a>`
          : ''}</div>
        <div class="sub">${esc(model)}</div>
        ${facts ? `<div class="facts">${facts}</div>` : ''}
        <div style="margin-top:4px"><span class="chip">${KIND[d.kind] || d.kind}</span></div></td>
    <td>${displayCell(d)}</td>
    <td>${networkCell(d)}</td>
    <td>${versionCell(d)}</td>
    <td>${pageCell(d)}</td>
    <td class="actions">
      ${d.online !== false ? '' : `<button type="button" data-forget="${esc(d.key)}" title="Remove until it is discovered again">Forget</button>`}
      <button type="button" class="more" data-more="${esc(d.key)}" aria-expanded="false"
        title="Everything this panel reports" aria-label="Details for ${esc(d.name || d.id)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6 1.4-1.4Z"/></svg></button>
    </td>
  </tr>` + (open.has(d.key) ? detailRow(d) : '');
}
// Which panels are expanded, kept across the fifteen-second refresh so a
// detail being read does not fold itself up mid-sentence.
const open = new Set();
let last = null;
function render(data) {
  last = data;
  const ds = data.devices;
  fleetWebview = ds.map((d) => d.webview).filter(Boolean)
    .sort((a, b) => (major(b) || 0) - (major(a) || 0))[0] || null;
  const online = ds.filter((d) => d.online).length;
  const outdated = ds.filter((d) => d.version_status === 'outdated').length;
  const latest = Object.entries(data.latest || {})
    .map(([k, v]) => `${KIND[k] || k} <a href="${esc(v.url)}" target="_blank" rel="noopener" class="mono">${esc(v.version)}</a>`)
    .join(' · ');
  $('summary').innerHTML =
    `<span><b>${ds.length}</b> panels</span>` +
    `<span><b>${online}</b> online</span>` +
    `<span class="${outdated ? 'warn' : ''}"><b>${outdated}</b> need an update</span>` +
    (latest ? `<span>Latest: ${latest}</span>` : '');
  $('note').textContent = data.ha_error ? `Pages shown need Home Assistant (${data.ha_error}).` : '';
  $('note').className = 'note' + (data.ha_error ? ' err' : '');
  $('rows').innerHTML = ds.length
    ? ds.map((d) => row(d, data.now)).join('')
    : '<tr><td colspan="7" class="empty">No panels found yet. Kiosk Satellite panels announce themselves when their remote admin is on.</td></tr>';
}
async function load(path = 'api/devices', init) {
  try {
    const r = await fetch(path, init);
    render(await r.json());
  } catch (e) {
    $('note').textContent = 'Could not reach the add-on: ' + e.message;
    $('note').className = 'note err';
  }
}
$('scan').addEventListener('click', async (e) => {
  e.target.disabled = true;
  e.target.textContent = 'Scanning…';
  await load('api/scan', { method: 'POST' });
  e.target.disabled = false;
  e.target.textContent = 'Scan now';
});
$('rows').addEventListener('click', (e) => {
  const forget = e.target.closest('[data-forget]');
  if (forget) {
    open.delete(forget.dataset.forget);
    load('api/devices/' + encodeURIComponent(forget.dataset.forget), { method: 'DELETE' });
    return;
  }
  const more = e.target.closest('[data-more]');
  if (more) {
    const key = more.dataset.more;
    open.has(key) ? open.delete(key) : open.add(key);
    if (last) render(last);
  }
});
load();
setInterval(load, 15000);
</script>
</body>
</html>
