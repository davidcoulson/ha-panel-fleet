<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiosk Satellite Fleet</title>
<script>
  // Theme before first paint, as a panel's remote admin does it: the pick
  // saved in this browser, else Home Assistant's own dark mode when this
  // page sits in its frame, else the system's. app.js keeps it current.
  {
    let pick = 'auto';
    try { pick = localStorage.getItem('pf_theme') || 'auto'; } catch (e) { /* fine */ }
    let dark = matchMedia('(prefers-color-scheme: dark)').matches;
    // Up the frames to Home Assistant's window (the ingress page can sit
    // one or two frames down); another origin ends the walk.
    try {
      for (let w = window; w.parent !== w; w = w.parent) {
        const hass = w.parent.document.querySelector('home-assistant')?.hass;
        if (hass && hass.themes && typeof hass.themes.darkMode === 'boolean') { dark = hass.themes.darkMode; break; }
      }
    } catch (e) { /* another origin: keep the system's */ }
    document.documentElement.dataset.theme = pick === 'auto' ? (dark ? 'dark' : 'light') : pick;
  }
</script>
<link rel="stylesheet" href="static/app.css?v=__V__">
<link rel="stylesheet" href="static/fleet.css?v=__V__">
</head>
<body>
<section id="app">
  <!-- Phone top bar; on wide screens the rail is always visible instead. -->
  <div class="mobilebar">
    <button class="hamburger" id="navToggle" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <span class="brand-mark"></span>
    <div class="mbrand">
      <span class="mtitle">Kiosk Satellite</span>
      <span class="brand-sub">Fleet</span>
    </div>
  </div>
  <div class="shell">
    <aside id="sidebar">
      <!-- The panel admin's header: the mark, Kiosk Satellite, and where a
           panel names itself, this names the fleet. -->
      <div class="brand">
        <span class="brand-mark"></span>
        <div class="brand-text">
          <div class="brand-title">Kiosk Satellite <span class="dot" id="connDot"></span></div>
          <span class="brand-sub">Fleet</span>
        </div>
      </div>
      <div class="side-search">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="settingsSearch" type="search" placeholder="Search fleet settings" autocomplete="off" spellcheck="false">
          <button class="clear" id="settingsSearchClear" type="button" aria-label="Clear search" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </div>
      <div id="sideResults" class="edge-fade search-results"></div>
      <nav id="tabs" class="edge-fade"></nav>
      <div class="side-foot">
        <div class="foot-stats"><span class="stat" id="footVersion"></span><span class="stat" id="footStat"></span></div>
        <div class="foot-actions">
          <button class="icon-btn" id="themeBtn" title="Theme" aria-label="Theme"></button>
          <span class="stat" id="footTheme"></span>
        </div>
      </div>
    </aside>
    <div class="nav-backdrop" id="navBackdrop"></div>
    <main>
      <h1 id="pageTitle">Panels</h1>

      <!-- Panels: every Kiosk Satellite panel on the network. -->
      <div class="tab" id="tab-panels">
        <div class="pf-summary" id="summary"></div>
        <div class="banner warn hidden" id="note"></div>
        <div class="toolbar pf-toolbar">
          <div class="pf-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="Search panels" aria-label="Search panels">
          </div>
          <div class="pf-filter-wrap">
            <button id="filter-btn" type="button" class="btn-ghost" aria-expanded="false" aria-controls="filter-pop">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
              Filters<span class="pf-count" id="filter-count" hidden></span>
            </button>
            <div class="pf-pop" id="filter-pop" hidden>
              <div class="pf-pop-head"><span>Filters</span><button id="clear" type="button" class="btn-text" hidden>Clear all</button></div>
              <div id="filter-sections"></div>
            </div>
          </div>
          <span class="spacer"></span>
          <button id="scan" type="button" class="btn-primary">Scan now</button>
        </div>
        <div class="card pf-table-card">
          <div class="pf-table-scroll">
            <table class="pf-table">
              <thead>
                <tr><th>Status</th><th>Panel</th><th>Platform</th><th>Display</th><th>Network</th><th>Version</th><th>Dashboard</th><th></th></tr>
              </thead>
              <tbody id="rows"><tr><td colspan="8" class="pf-empty">Looking for panels…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Fleet: Panel Fleet leads; who follows and how each is doing. -->
      <div class="tab" id="tab-fleet"><div id="fleetBody"></div></div>

      <!-- Profiles: what each follower gets. -->
      <div class="tab" id="tab-profiles"><div id="profilesBody"></div></div>

      <!-- Updates: APKs per ABI, installed on the members. -->
      <div class="tab" id="tab-updates"><div id="updatesBody"></div></div>

      <!-- Wake word models: the custom set mirrored on the members. -->
      <div class="tab" id="tab-wake"><div id="wakeBody"></div></div>

      <!-- Search results over the fleet settings. -->
      <div class="tab" id="tab-search"><div class="card search-results" id="searchBody"></div></div>

      <!-- One tab per settings category, built from the definitions. -->
      <div id="settingsTabs"></div>
    </main>
  </div>
</section>
<script type="module" src="static/app.js?v=__V__"></script>
</body>
</html>
