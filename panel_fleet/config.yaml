name: Panel Fleet
version: "0.1.4"
slug: panel_fleet
description: See every Kiosk Satellite and ha-paneld wall panel on the network, whether it is online and up to date, and what it is showing.
url: https://github.com/davidcoulson/ha-panel-fleet
arch:
  - aarch64
  - amd64
init: false
# mDNS discovery needs the host's network.
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:monitor-dashboard
panel_title: Panel Fleet
homeassistant_api: true
options:
  scan_interval: 60
schema:
  scan_interval: int(15,3600)
